<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Blurz — Login Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: rgba(17, 17, 17, .88);
      --border: #333;
      --muted: #aaa;
      --accent: #c4c4c4;
      --accent-strong: #858585;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
      color: #f4f4f4;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(170,170,170,.13), transparent 35%),
        radial-gradient(ellipse at 82% 78%, rgba(105,105,105,.16), transparent 38%),
        radial-gradient(ellipse at 50% 110%, rgba(210,210,210,.08), transparent 42%),
        linear-gradient(145deg, #020202, #0c0c0c 55%, #030303);
      font-family: Inter, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .42;
      background-image:
        radial-gradient(1px 1px at 8% 16%, #fff 99%, transparent),
        radial-gradient(1px 1px at 22% 72%, #ddd 99%, transparent),
        radial-gradient(1.5px 1.5px at 71% 21%, #fff 99%, transparent),
        radial-gradient(1px 1px at 88% 62%, #ddd 99%, transparent),
        radial-gradient(1px 1px at 48% 44%, #fff 99%, transparent),
        radial-gradient(1px 1px at 62% 88%, #ddd 99%, transparent),
        radial-gradient(1px 1px at 34% 30%, #fff 99%, transparent);
      background-size: 290px 250px;
    }
    .shell { position: relative; width: min(100%, 420px); }
    .brand { margin: 0 0 24px; text-align: center; }
    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin-bottom: 12px;
      border: 1px solid #555;
      border-radius: 17px;
      color: #eee;
      background: linear-gradient(145deg, #292929, #090909);
      box-shadow: 0 0 34px rgba(190,190,190,.12), inset 0 1px rgba(255,255,255,.12);
      font-size: 25px;
    }
    .brand h1 {
      margin: 0;
      color: #e5e5e5;
      font: 700 30px/1.2 Orbitron, sans-serif;
      letter-spacing: .12em;
    }
    .brand p { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .card {
      padding: 30px;
      border: 1px solid rgba(190,190,190,.22);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 45px rgba(180,180,180,.06), inset 0 1px rgba(255,255,255,.06);
      backdrop-filter: blur(16px);
    }
    .card h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
    .intro { margin: 8px 0 24px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .field { display: block; margin: 0 0 17px; }
    .field span { display: block; margin-bottom: 8px; color: #d6d6d6; font-size: 12px; font-weight: 600; }
    .field input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #393939;
      border-radius: 9px;
      outline: none;
      background: #090909;
      color: #f5f5f5;
      font: 14px Inter, sans-serif;
      transition: border-color .18s, box-shadow .18s;
    }
    .field input::placeholder { color: #777; }
    .field input:focus { border-color: #aaa; box-shadow: 0 0 0 3px rgba(190,190,190,.12); }
    .submit {
      width: 100%;
      height: 46px;
      margin-top: 5px;
      border: 1px solid #bdbdbd;
      border-radius: 9px;
      color: #090909;
      background: linear-gradient(135deg, #e1e1e1, #929292);
      font: 700 13px Inter, sans-serif;
      letter-spacing: .02em;
      cursor: default;
    }
    .preview-note {
      margin: 17px 0 0;
      color: #999;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }
    .footer { margin: 20px 0 0; color: #777; font-size: 11px; text-align: center; }
    a { color: #d0d0d0; text-decoration-color: #666; text-underline-offset: 3px; }
    a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid #eee; outline-offset: 3px; }
    @media (max-width: 440px) { .card { padding: 24px 20px; } .brand h1 { font-size: 26px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <h1>BLURZ</h1>
      <p>A quieter corner of the digital universe.</p>
    </header>
    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title">Welcome back</h2>
      <p class="intro">Sign-in screen concept for the Blurz interface.</p>
      <form aria-label="Login preview">
        <label class="field">
          <span>Email or username</span>
          <input type="text" name="username" placeholder="Enter your email or username" autocomplete="username">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password">
        </label>
        <button class="submit" type="button" disabled>Sign in — preview only</button>
      </form>
      <p class="preview-note">This is a visual preview. Sign-in, accounts, and password handling are not connected.</p>
    </section>
    <p class="footer">Monochrome space theme · <a href="/">Back to Blurz</a></p>
  </main>
</body>
</html>
